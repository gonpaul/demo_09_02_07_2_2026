{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="{% static 'Icon.ico' %}" type="image/x-icon">
    <title>{% block title %} {% endblock %}. Магазин обуви</title>
    <style>
        body {
            background: #dbd9d9;
            margin: 1rem 2rem;
        }
        #content {
            text-align: center;
        }
        #login {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }
        #login-form {
            border: solid 1px gray;
            padding: 1rem;
            border-radius: 2rem;
            background-color: white;

        }
        #item-list{
            width: 100%;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: space-between;
            row-gap: 16px;
            margin-top: 1rem;

        }
        .item-card{
            height: 340px;
            width: 280px;
            border: solid 1px black;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
            background-color: white;
        }
        .list-style-none {
            list-style: none;
        }
        .item-description {
            display: flex;
            flex-flow: row wrap;
            gap: 10px;
            margin: 10px 15px;
            justify-content: space-around;
            border-top: solid 1px gray;
        }
        .bg-accent {}
        .big-sales {
            color: rgb(192, 71, 71)
        }
    </style>
</head>
<body>
    <div id="content">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
